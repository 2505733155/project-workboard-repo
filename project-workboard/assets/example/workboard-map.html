<header><div><div class="eyebrow">PROJECT WORKBOARD · 2.0</div><h1 id="project-title">项目任务导图</h1><p id="project-description"></p></div><span id="sample-badge" class="sample">虚构示例 · 创建项目时替换</span></header>
<nav class="toolbar" aria-label="导图工具">
<button id="overview">阶段总览</button><button id="focus-current">定位当前任务</button>
<div class="search-wrap"><input id="search" type="search" aria-label="搜索任务编号或标题" placeholder="搜索编号或标题…" autocomplete="off"><div id="results" class="search-results" hidden></div></div>
<button id="open-detail" class="right-button">查看详情</button><button id="scratch-toggle">临时草稿</button>
<div class="legend" aria-label="状态图例"><span><i class="swatch" style="background:#465664"></i>待办</span><span><i class="swatch" style="background:#215bd6"></i>进行中</span><span><i class="swatch" style="background:#8b5b0d"></i>待用户配合</span><span><i class="swatch" style="background:#21684b"></i>已完成</span></div>
</nav>
<main id="layout" class="layout">
<div class="canvas-wrap">
<div id="canvas" class="canvas" aria-label="项目任务导图"><div id="world" class="world"><svg id="edges" class="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
<div id="diagnostics" class="diagnostics" hidden><div id="diagnostic-list"></div><details><summary>查看原始记录（供修正）</summary><pre id="raw-data"></pre></details></div>
<div id="toast" role="status" hidden></div><div class="hint">滚轮上下 · Ctrl＋滚轮缩放 · Shift＋滚轮左右 · 左／右键拖动背景平移</div>
<div class="canvas-tools"><button id="zoom-out" aria-label="缩小">−</button><output id="scale-value">82%</output><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应</button></div>
</div>
<aside id="detail" class="detail" aria-label="所选节点详情"><button id="close-detail" class="right-button">返回画布</button><details id="warnings" class="notice" hidden></details><div id="detail-content"></div></aside>
</main>
<footer><span id="view-count"></span><span id="storage-status" role="status"></span></footer>
<dialog id="scratch" aria-labelledby="scratch-title"><h2 id="scratch-title">临时草稿</h2><p>用于记录想法或准备发给智能体的内容。草稿仅保存在当前浏览器，不会自动发送或写回项目任务；也可下载保留。</p><textarea id="draft" aria-label="草稿内容" spellcheck="false"></textarea><span id="draft-count" class="muted"></span><div class="dialog-actions"><button id="download-draft">下载草稿</button><button id="scratch-close">关闭</button></div></dialog>

    const dx=(event.deltaX||0)*ux,dy=(event.deltaY||0)*uy;
    if(event.ctrlKey)return zoom(view,Math.exp(-dy*.002),(event.clientX??rect.width/2)-(rect.left||0),(event.clientY??rect.height/2)-(rect.top||0));
    return {...view,pan:{x:view.pan.x-(event.shiftKey?(dx||dy):dx),y:view.pan.y-(event.shiftKey?0:dy)}};
  }
  function restoreView(raw,index,base){
    const fallback=()=>({...base,pan:{...base.pan},expanded:new Set(base.expanded)});
    if(raw===null||raw===undefined||raw==='')return {view:fallback(),warning:null};
    try{
      const x=JSON.parse(raw);
      if(!x||!Array.isArray(x.expanded)||!x.pan||!Number.isFinite(x.pan.x)||!Number.isFinite(x.pan.y)||!Number.isFinite(x.scale)||x.scale<=0)throw Error();
      const expanded=new Set(x.expanded.filter(k=>index.nodes.has(k)));
      const selected=index.nodes.has(x.selected)?x.selected:base.selected;
      const view={expanded,selected,pan:{x:x.pan.x,y:x.pan.y},scale:clamp(x.scale)};
      // Restore selection without resurrecting removed nodes.
      view.expanded=reveal(index,selected,expanded);
      return {view,warning:x.selected!==selected||expanded.size!==x.expanded.length?'已忽略失效的视图节点。':null};
    }catch{return {view:fallback(),warning:'保存的视图不可用，已使用默认视图。'};}
  }
  function evidenceUrl(path,root,base){
    if(typeof path!=='string'||!path.trim())return null;
    try{
      const encodePath=value=>value.split('/').map(encodeURIComponent).join('/');
      let p=path.replace(/\\/g,'/');
      const drive=/^[A-Za-z]:\//.test(p),unc=path.startsWith('\\\\');
      const absoluteUrl=!drive&&!unc&&/^[A-Za-z][A-Za-z0-9+.-]*:/.test(p);
      if(!absoluteUrl){
        p=encodePath(p);
        if(drive)p='file:///'+p.replace(/^([A-Za-z])%3A\//,'$1:/');
        else if(unc)p='file:'+p;
      }
      let r=String(root||'./').replace(/\\/g,'/');
      if(!/^[A-Za-z][A-Za-z0-9+.-]*:/.test(r))r=encodePath(r);
      const url=new URL(p,new URL(r.endsWith('/')?r:r+'/',base));
      return ['file:','https:','http:'].includes(url.protocol)?url.href:null;
    }catch{return null;}
  }
  return {build,children,taskChildren,ancestors,reveal,visible,layout,wheel,zoom,restoreView,evidenceUrl};
})();
</script>
<script id="workboard-ui">
'use strict';
(()=>{
  const $=id=>document.getElementById(id),W=Workboard;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const raw=$('workboard-data').textContent;
  let data,index,parseError='';
  try{data=JSON.parse(raw);}catch(e){data=null;parseError='JSON 解析失败：'+e.message;}
  index=W.build(data);
  if(parseError)index.errors.unshift(parseError);
  data=data||{meta:{},tasks:[],stages:[],sources:[],history:[],decisions:[]};
  const meta=data.meta||{};
  if(index.errors.length){
    $('project-title').textContent='任务数据需要修正';
    $('project-description').textContent='请先修正下列数据，再重新打开或刷新页面。';
    $('sample-badge').hidden=true;
    $('diagnostics').hidden=false;
    $('diagnostic-list').innerHTML='<h2>任务数据需要修正</h2><p>未生成导图，未自动补造或调整父子关系。</p><ul>'+index.errors.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    $('raw-data').textContent=raw;
    $('detail-content').textContent='原始记录保留在左侧诊断面板中。';
    $('storage-status').textContent='任务数据未通过检查';
    for(const el of document.querySelectorAll('.toolbar button,.toolbar input,.canvas-tools button'))el.disabled=true;
    return;
  }

  $('project-title').textContent=String(meta.title||'项目任务导图');
  $('project-description').textContent=String(meta.description||'从阶段到任务，逐层找到当前一步。');
  document.title=String(meta.title||'Project Workboard')+' · 工作导图';
  $('sample-badge').hidden=!meta.sample;
  const initial={expanded:new Set(['project']),selected:'project',pan:{x:25,y:25},scale:.82};
  const current=meta.currentTaskId===undefined||meta.currentTaskId===null||meta.currentTaskId===''?null:'task:'+String(meta.currentTaskId);
  if(current&&index.nodes.has(current)){
    initial.selected=current;initial.expanded=W.reveal(index,current,initial.expanded);
  }
  let storage=null,storageKey=null,storageMessage='';
  if(typeof meta.storageKey==='string'&&meta.storageKey.trim()){
    storageKey='project-workboard:v2:'+meta.storageKey;
    try{storage=window.localStorage;}catch{storageMessage='本地存储不可用；仍可浏览、编辑和下载草稿。';}
  }else{storageMessage='未设置项目存储标识；本次草稿与视图不自动保存。';}
  function readStore(suffix){
    if(!storage)return null;
    try{return storage.getItem(storageKey+':'+suffix);}catch{storage=null;storageMessage='无法读取本地存储；仍可浏览和下载草稿。';return null;}
  }
  const restored=W.restoreView(readStore('view'),index,initial);
  if(restored.warning)storageMessage=restored.warning;
  let view=restored.view,positions=new Map(),drag=null,saveTimer=null,toastTimer=null;
  function storageStatus(){$('storage-status').textContent=storageMessage||'草稿与视图仅保存在当前浏览器';}
  function writeStore(suffix,value){
    if(!storage)return;
    try{storage.setItem(storageKey+':'+suffix,value);}catch{storageMessage='本地保存失败，请下载草稿以保留内容。';storageStatus();}
  }
  function saveView(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>writeStore('view',JSON.stringify({...view,expanded:[...view.expanded]})),120);
  }
  window.addEventListener('pagehide',()=>{clearTimeout(saveTimer);writeStore('view',JSON.stringify({...view,expanded:[...view.expanded]}));});
  const state=s=>index.statuses.get(s)||{label:String(s||'未定义'),color:'#465664'};
  const list=(id)=>W.children(index,id);
  function applyTransform(){
    $('world').style.transform='translate('+view.pan.x+'px,'+view.pan.y+'px) scale('+view.scale+')';
    $('scale-value').textContent=Math.round(view.scale*100)+'%';
  }
  function notify(text){
    $('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>$('toast').hidden=true,2200);
  }
  function center(){
    const pos=positions.get(view.selected);if(!pos)return;
    const box=$('canvas').getBoundingClientRect();
    view.pan={x:box.width*.57-view.scale*(pos.x+pos.w/2),y:box.height*.48-view.scale*(pos.y+pos.h/2)};
    applyTransform();
  }
  function fit(){
    if(!positions.size)return;
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    for(const p of positions.values()){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x+p.w);maxY=Math.max(maxY,p.y+p.h);}
    const box=$('canvas').getBoundingClientRect();
    view.scale=Math.max(.000001,Math.min(1,(box.width-85)/(maxX-minX),(box.height-80)/(maxY-minY)));
    view.pan={x:(box.width-(maxX-minX)*view.scale)/2-minX*view.scale,y:(box.height-(maxY-minY)*view.scale)/2-minY*view.scale};
    applyTransform();
  }
  function renderMap(){
    const active=document.activeElement;
    const focus=active?.dataset?.toggle?{attribute:'data-toggle',id:active.dataset.toggle}:active?.dataset?.select?{attribute:'data-select',id:active.dataset.select}:null;
    positions=W.layout(index,view.expanded);
    const lineage=new Set(W.ancestors(index,view.selected));
    let edges='';
    for(const [id,p] of positions){
      const parent=index.parentMap.get(id),a=positions.get(parent);
      if(a)edges+='<path class="'+(lineage.has(id)?'lineage':'')+'" d="M '+(a.x+a.w)+' '+(a.y+a.h/2)+' C '+(a.x+a.w+30)+' '+(a.y+a.h/2)+','+(p.x-30)+' '+(p.y+p.h/2)+','+p.x+' '+(p.y+p.h/2)+'"/>';
    }
    $('edges').innerHTML=edges;
    $('nodes').innerHTML=W.visible(index,view.expanded).map(id=>{
      const n=index.nodes.get(id),p=positions.get(id),kids=list(id),s=state(n.record.status),open=view.expanded.has(id);
      const grouped=n.type==='task'&&kids.some(k=>index.nodes.get(k).type==='group');
      const title=n.type==='project'?'项目总览':n.title;
      const idline=n.type==='project'?'PROJECT':n.type==='group'?'任务分类':String(n.id);
      const label=n.type==='task'?s.label+' · '+String(n.record.priority||'未设优先级')+(grouped?' · '+kids.length+' 类 / '+W.taskChildren(index,id).length+' 项直属任务':''):n.type==='group'?kids.length+' 项直属任务 · 展示分类':n.type==='stage'?String(n.record.state||'未记录签收状态'):'阶段 · 任务 · 子任务';
      return '<div class="node '+(id===view.selected?'selected':'')+'" data-node="'+esc(id)+'" style="left:'+p.x+'px;top:'+p.y+'px;width:'+p.w+'px;height:'+p.h+'px;--fill:'+(n.type==='task'?s.color:n.type==='group'?n.color:n.type==='stage'?'#344b5d':'#264969')+'">'+
        '<button class="node-main" data-select="'+esc(id)+'" aria-label="'+esc(idline+' '+title)+'" '+(id===view.selected?'aria-current="true"':'')+'><span class="node-id"><span class="id-text">'+esc(idline)+'</span>'+(kids.length?'<span class="count" title="'+(grouped?'直属分类数':'直属子项数')+'">'+kids.length+'</span>':'')+'</span><span class="node-title">'+esc(title)+'</span><span class="node-meta" title="'+esc(label)+'">'+esc(label)+'</span></button>'+
        (kids.length?'<button class="toggle" data-toggle="'+esc(id)+'" aria-expanded="'+open+'" aria-label="'+esc((open?'收起':'展开')+title)+'">'+'<svg class="toggle-icon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false"><path d="M3 8h10'+(open?'':' M8 3v10')+'" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'+'</button>':'')+'</div>';
    }).join('');
    if(focus)for(const b of $('nodes').querySelectorAll('['+focus.attribute+']'))if(b.getAttribute(focus.attribute)===focus.id)b.focus({preventScroll:true});
    $('view-count').textContent='显示 '+positions.size+' 个节点 · '+data.tasks.length+' 项任务';
    applyTransform();
  }
  const para=text=>'<p>'+esc(text||'尚无记录。')+'</p>';
  const section=(title,content)=>'<section><h3>'+esc(title)+'</h3>'+content+'</section>';
  function goButton(key,title){
    return '<button class="entry" data-go="'+esc(key)+'"'+(index.nodes.has(key)?'':' disabled')+'>'+esc(title)+(index.nodes.has(key)?'':'（记录不存在）')+'</button>';
  }
  function evidence(items){
    if(!Array.isArray(items)||!items.length)return para('尚无证据入口。');
    return '<ul class="evidence">'+items.map(e=>{
      const path=typeof e?.path==='string'?e.path:'',url=W.evidenceUrl(path,meta.projectRoot||'./',location.href);
      return '<li>'+(url?'<a data-evidence href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(e.label||path)+'</a>':'<span>'+esc(e?.label||'未设置路径')+'</span>')+
        '<code>'+esc(path)+'</code>'+(path?'<button class="copy-path" data-copy="'+esc(path)+'">复制路径</button>':'')+'</li>';
    }).join('')+'</ul>';
  }
  function records(items,key){
    const node=index.nodes.get(key);
    const rows=(Array.isArray(items)?items:[]).filter(r=>r&&typeof r==='object'&&(node.type==='project'||node.type==='stage'&&String(r.stage)===String(node.id)||node.type==='task'&&String(r.task)===String(node.id)));
    return rows.length?rows.map(r=>'<div class="record"><strong>'+esc(r.title||r.date||'记录')+'</strong><span class="muted">'+esc(r.date||'')+'</span>'+para(r.detail||r.description)+evidence(r.evidence||[])+'</div>').join(''):para('暂无关联记录；项目总览可查看全部历史与决策。');
  }
  function detail(){
    const n=index.nodes.get(view.selected);if(!n)return;
    const r=n.record,kids=list(view.selected),realKids=n.type==='task'?W.taskChildren(index,view.selected):[],groupKids=n.type==='task'?kids.filter(k=>index.nodes.get(k).type==='group'):[];
    const chain=W.ancestors(index,view.selected).map(k=>index.nodes.get(k).type==='project'?'项目':index.nodes.get(k).type==='group'?index.nodes.get(k).title:String(index.nodes.get(k).id)).join(' / ');
    let content='<div class="eyebrow">'+(n.type==='task'?'TASK':n.type==='group'?'任务分类':n.type==='stage'?'PHASE':'PROJECT')+'</div><div class="breadcrumb">'+esc(chain)+'</div><h2>'+esc(n.title)+'</h2>';
    if(n.type==='task'){
      const s=state(r.status);
      content+='<div class="chips"><span class="chip" style="background:'+s.color+'">'+esc(s.label)+'</span><span class="chip">'+esc(r.priority||'未设优先级')+'</span><span class="chip">'+esc(r.id)+'</span></div>'+
        section('工作内容',para(r.description))+section('完成标准',para(r.acceptance))+
        (groupKids.length?section('任务分类 · '+groupKids.length,groupKids.map(k=>goButton(k,index.nodes.get(k).title+' · '+list(k).length+' 项')).join('')):'')+
        section('直属子任务 · '+realKids.length,realKids.length?realKids.map(k=>goButton(k,String(index.nodes.get(k).id)+' · '+index.nodes.get(k).title)).join(''):para('没有已登记子任务。新增层级须先由用户确认。'))+
        section('依赖任务',(Array.isArray(r.deps)&&r.deps.length)?r.deps.map(id=>goButton('task:'+String(id),String(id)+' · '+(index.nodes.get('task:'+String(id))?.title||'未知任务'))).join(''):para('没有登记依赖。'))+
        section('结果与验证',para(r.verification))+section('证据入口',evidence(r.evidence));
      if(r.updatedAt)content+='<p class="muted">更新：'+esc(r.updatedAt)+'</p>';
    }else if(n.type==='group'){
      content+=para(r.description||'分类按明确记录的成员组织展示，不随任务状态自动调整。')+
        section('分类内直属任务 · '+kids.length,kids.length?kids.map(k=>goButton(k,String(index.nodes.get(k).id)+' · '+index.nodes.get(k).title)).join(''):para('此分类暂无成员。'))+
        section('所属任务',goButton('task:'+String(r.parent),String(r.parent)+' · '+index.nodes.get('task:'+String(r.parent)).title))+
        section('分类说明',para('分类仅用于组织展示，不计入任务总数，不代表任务或阶段通过验收。真实父子关系、任务状态、依赖和证据仍以任务记录为准。'));
    }else if(n.type==='stage'){
      content+='<div class="chips"><span class="chip">'+esc(r.state||'未记录签收状态')+'</span></div>'+
        section('阶段要求',para(r.environment))+section('阶段概况',para(r.summary))+
        section('阶段完成条件',para(r.acceptance))+section('遗留事项',para(r.pending))+
        section('直属任务 · '+kids.length,kids.length?kids.map(k=>goButton(k,String(index.nodes.get(k).id)+' · '+index.nodes.get(k).title)).join(''):para('本阶段暂无任务。'))+
        section('阶段证据',evidence(r.evidence));
    }else{
      content+=para(meta.description)+section('阶段入口',kids.length?kids.map(k=>goButton(k,index.nodes.get(k).title)).join(''):para('暂无阶段或任务。请由智能体按已确认的计划维护。'))+
        section('如何阅读',para('点击节点查看详情，圆形按钮展开下一层。分类仅组织显示，真实父子关系和依赖以任务记录为准。阶段签收以阶段记录为准。'))+
        section('项目材料',evidence(data.sources));
    }
    if(n.type!=='group')content+=section('历史记录',records(data.history,view.selected))+section('历史决策',records(data.decisions,view.selected));
    $('detail-content').innerHTML=content;$('detail').dataset.selected=view.selected;$('detail').scrollTop=0;
  }
  function choose(id,centerView=true){
    if(!index.nodes.has(id))return;
    view.selected=id;view.expanded=W.reveal(index,id,view.expanded);
    if(centerView&&view.scale<.5)view.scale=.82;
    renderMap();detail();$('layout').classList.add('details-open');
    if(centerView)center();saveView();
  }
  $('nodes').addEventListener('click',event=>{
    const b=event.target.closest('[data-toggle]');
    if(b){
      const id=b.dataset.toggle;
      if(view.expanded.has(id)){
        view.expanded.delete(id);
        if(W.ancestors(index,view.selected).slice(0,-1).includes(id)){view.selected=id;detail();}
      }else view.expanded.add(id);
      renderMap();saveView();return;
    }
    const s=event.target.closest('[data-select]');if(s)choose(s.dataset.select,false);
  });
  $('detail').addEventListener('click',async event=>{
    const go=event.target.closest('[data-go]');if(go){choose(go.dataset.go);return;}
    const copy=event.target.closest('[data-copy]');
    if(copy){
      try{await navigator.clipboard.writeText(copy.dataset.copy);notify('已复制路径');}
      catch{const code=copy.parentElement.querySelector('code');const range=document.createRange();range.selectNodeContents(code);const sel=getSelection();sel.removeAllRanges();sel.addRange(range);notify('请复制已选中的路径');}
    }
  });
  const canvas=$('canvas');
  let rightContext=false;
  canvas.addEventListener('pointerdown',event=>{
    rightContext=false;
    if(![0,2].includes(event.button)||event.target.closest('.node'))return;
    rightContext=event.button===2;
    if(rightContext)event.preventDefault();
    drag={x:event.clientX,y:event.clientY,pan:{...view.pan},id:event.pointerId,button:event.button};canvas.setPointerCapture(event.pointerId);canvas.classList.add('dragging');
  });
  canvas.addEventListener('contextmenu',event=>{
    if(rightContext||!event.target.closest('.node'))event.preventDefault();
  });
  canvas.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;view.pan={x:drag.pan.x+event.clientX-drag.x,y:drag.pan.y+event.clientY-drag.y};applyTransform();});
  const end=()=>{const right=drag?.button===2;if(drag)saveView();drag=null;canvas.classList.remove('dragging');if(right)setTimeout(()=>{rightContext=false;},0);};
  for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,end);
  canvas.addEventListener('wheel',event=>{event.preventDefault();view=W.wheel(view,event,canvas.getBoundingClientRect());applyTransform();saveView();},{passive:false});
  for(const [id,factor] of [['zoom-in',1.15],['zoom-out',1/1.15]])$(id).onclick=()=>{const r=canvas.getBoundingClientRect();view=W.zoom(view,factor,r.width/2,r.height/2);applyTransform();saveView();};
  $('fit').onclick=()=>{fit();saveView();};
  $('overview').onclick=()=>{view.selected='project';view.expanded=new Set(['project']);renderMap();detail();fit();$('layout').classList.add('details-open');saveView();};
  $('focus-current').disabled=!index.nodes.has(current);
  $('focus-current').onclick=()=>choose(current);
  $('open-detail').onclick=()=>$('layout').classList.add('details-open');
  $('close-detail').onclick=()=>{$('layout').classList.remove('details-open');$('open-detail').focus();};
  const search=$('search'),results=$('results');
  search.addEventListener('input',()=>{
    const term=search.value.trim().toLowerCase();
    if(!term){results.hidden=true;return;}
    const found=[...index.nodes].filter(([,n])=>n.type!=='project'&&(String(n.id)+' '+n.title).toLowerCase().includes(term));
    found.sort((a,b)=>(String(b[1].id).toLowerCase()===term)-(String(a[1].id).toLowerCase()===term));
    results.innerHTML=found.length?found.slice(0,20).map(([key,n])=>'<button data-search="'+esc(key)+'"><small>'+esc(String(n.id)+(n.type==='task'?' · '+state(n.record.status).label:n.type==='group'?' · 任务分类':' · 阶段'))+'</small>'+esc(n.title)+'</button>').join('')+(found.length>20?'<p class="muted">仅显示前 20 项，请增加关键词缩小范围。</p>':''):'<p class="muted">没有找到匹配项。</p>';
    results.hidden=false;
  });
  results.addEventListener('click',event=>{const b=event.target.closest('[data-search]');if(b){choose(b.dataset.search);results.hidden=true;search.value='';search.focus();}});
  search.addEventListener('keydown',event=>{
    if(event.key==='Escape')results.hidden=true;
    if(event.key==='Enter'&&!results.hidden){const first=results.querySelector('button');if(first){event.preventDefault();first.click();}}
    if(event.key==='ArrowDown'&&!results.hidden){event.preventDefault();results.querySelector('button')?.focus();}
  });
  results.addEventListener('keydown',event=>{if(event.key==='Escape'){results.hidden=true;search.focus();}});
  const draft=$('draft');draft.value=readStore('draft')||'';
  $('scratch-toggle').onclick=()=>{$('scratch').showModal();draft.focus();};
  $('scratch-close').onclick=()=>$('scratch').close();
  draft.addEventListener('input',()=>{writeStore('draft',draft.value);$('draft-count').textContent=draft.value.length+' 字符';});
  $('download-draft').onclick=()=>{
    const blob=new Blob([draft.value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download='workboard-draft.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  $('draft-count').textContent=draft.value.length+' 字符';
  storageStatus();
  if(index.warnings.length){$('warnings').hidden=false;$('warnings').innerHTML='<summary>数据提示 · '+index.warnings.length+'</summary><ul>'+index.warnings.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
  renderMap();detail();
  if(readStore('view')===null||restored.warning)center();
  window.addEventListener('resize',()=>{if(!drag)center();});
